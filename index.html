<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>岐阜統一戦記</title>
<meta name="description" content="岐阜県42市町村を、連携協定と合併で統一する内政シミュレーション。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* 構成: 上に戦況バー、中央に県の地図、下に選んだ市町村の台帳と操作。地図は行政地図の色、陣営は朱・藍・萌黄・紫 */
:root {
  --bg: #e2e9ed;
  --surface: #f7f9fa;
  --surface-2: #eaeff2;
  --ink: #1b2830;
  --ink-2: #566771;
  --line: #c4cfd6;
  --land: #d3dccd;
  --land-hi: #e6ecd9;
  --me: #cf4526;
  --r1: #2c5fa3;
  --r2: #5b8a24;
  --r3: #874c9b;
  --good: #2b7a4b;
  --warn: #a8701a;
  --bad: #b5352f;
  --font-display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-body: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171c; --surface: #18222a; --surface-2: #202c35; --ink: #e4ecf0; --ink-2: #98aab5; --line: #31424e;
    --land: #2a3731; --land-hi: #36463a; --me: #ec6a4b; --r1: #5d90d8; --r2: #8bbb55; --r3: #b682c9;
    --good: #5cbf85; --warn: #e0a645; --bad: #ef6b63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171c; --surface: #18222a; --surface-2: #202c35; --ink: #e4ecf0; --ink-2: #98aab5; --line: #31424e;
  --land: #2a3731; --land-hi: #36463a; --me: #ec6a4b; --r1: #5d90d8; --r2: #8bbb55; --r3: #b682c9;
  --good: #5cbf85; --warn: #e0a645; --bad: #ef6b63; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-width: 720px; margin: 0 auto; }

/* 戦況バー */
.status { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.status .date { font-family: var(--font-display); font-size: 17px; letter-spacing: .02em; margin-right: auto; }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat small { font-size: 10.5px; color: var(--ink-2); letter-spacing: .06em; }
.stat b { font-size: 15px; }
.stat b.neg { color: var(--bad); }
.pips { display: flex; gap: 3px; margin-top: 3px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--me); }
.pips i.on { background: var(--me); }
.iconbtn { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }

/* 地図 */
.mapwrap { position: relative; overflow: hidden; background: var(--bg); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map path.mu { fill: var(--land); stroke: var(--surface); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .4s; }
#map .lbl text { fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; font-family: var(--font-body); font-weight: 700; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
#map .lbl text.cap { font-family: var(--font-display); font-weight: 400; }
#map .sel { fill: none; stroke: var(--ink); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .talk2 { animation-delay: -.6s; }
#map .talk { fill: none; stroke-width: 3; vector-effect: non-scaling-stroke; stroke-dasharray: 6 5; pointer-events: none; animation: march 1.2s linear infinite; }
@keyframes march { to { stroke-dashoffset: -22; } }
.chips { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.legend { position: absolute; left: 12px; top: 50px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 4px 10px; border-radius: 8px; max-width: calc(100% - 24px); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 6px 20px rgb(0 0 0 / .18); transition: opacity .25s, transform .25s; }
.toast[hidden] { display: block !important; opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }

/* 台帳（選んだ市町村） */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -6px 20px rgb(0 0 0 / .1); display: flex; flex-direction: column; max-height: 58%; }
.sheet .handle { flex: none; height: 22px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
.sheet .handle i { width: 40px; height: 4px; border-radius: 2px; background: var(--line); display: block; }
.sheet .body { overflow-y: auto; padding: 0 16px 12px; min-height: 0; }
.sheet[data-open="false"] .full { display: none; }
.sheet[data-open="false"] .peek { cursor: pointer; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 0; letter-spacing: .02em; }
.facts { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); }
.facts .alert { color: var(--bad); font-weight: 700; }
.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; margin: 10px 0 2px; }
.head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; }
.tag.owner { border-color: transparent; color: #fff; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; margin: 10px 0 4px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.kv span { color: var(--ink-2); }
.meter { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) 2em; align-items: center; gap: 8px; font-size: 12.5px; }
.meter span { color: var(--ink-2); }
.meter b { text-align: right; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.bar.rel i { background: var(--me); }
.bar.low i { background: var(--bad); }
.note { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }
.note.talking { color: var(--ink); font-weight: 700; }
.cmds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.cmd { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-height: 48px; }
.cmd .ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.cmd strong { font-size: 13.5px; }
.cmd small { font-size: 11.5px; color: var(--ink-2); }
.cmd .cost { font-size: 11.5px; color: var(--ink-2); }
.cmd[aria-disabled="true"] { opacity: .55; }
.cmd.primary { border-color: var(--me); }
.cmd:not([aria-disabled="true"]):active { transform: translateY(1px); }
.empty { color: var(--ink-2); font-size: 13.5px; }
.empty b { color: var(--ink); }

/* 下のバー */
.bottombar { display: grid; grid-template-columns: 1fr 1fr 1fr 1.5fr; gap: 8px; padding: 8px 16px 10px; background: var(--surface); border-top: 1px solid var(--line); }
.bottombar button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 13.5px; position: relative; }
.bottombar .end { background: var(--me); border-color: var(--me); color: #fff; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.bottombar .end:disabled { opacity: .45; cursor: default; }
.bottombar .end small { font-weight: 400; font-size: 11px; opacity: .9; }
.badge { position: absolute; top: 6px; right: 8px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--me); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }

/* 重ねる画面 */
.overlay { position: fixed; inset: 0; background: rgb(10 16 20 / .55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; padding-top: env(safe-area-inset-top, 0px); }
.panel { background: var(--surface); width: 100%; max-width: 720px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.panel h3 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 4px; }
.panel .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; }
.panel .close { float: right; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 16px; cursor: pointer; font-size: 14px; }
.btn.main { background: var(--me); border-color: var(--me); color: #fff; font-weight: 700; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* タイトル */
.title-panel { max-height: 100%; height: 100%; border-radius: 0; overflow-y: auto; }
.kicker { font-size: 12px; letter-spacing: .14em; color: var(--ink-2); }
.logo { font-family: var(--font-display); font-size: clamp(40px, 12vw, 64px); line-height: 1.05; margin: 6px 0 10px; letter-spacing: .02em; }
.logo em { font-style: normal; color: var(--me); }
.lead { font-size: 15px; max-width: 34em; margin: 0 0 18px; }
.pick { display: grid; gap: 14px; }
.pick h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.pick .lv { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); font-weight: 400; }
.pick .opts { display: flex; gap: 8px; flex-wrap: wrap; }
.pick .opts button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; cursor: pointer; text-align: left; }
.pick .opts button small { display: block; color: var(--ink-2); font-size: 11px; }
.pick .opts button .money { display: block; font-size: 11.5px; color: var(--ink); margin-top: 2px; }
.selrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); max-width: 100%; }
.howto { margin: 18px 0 0; padding-left: 1.2em; color: var(--ink-2); font-size: 13px; display: grid; gap: 4px; }
.howto b { color: var(--ink); }

.stickygo { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); margin: 20px -16px calc(-20px - env(safe-area-inset-bottom, 0px)); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 16px rgb(0 0 0 / .08); z-index: 1; }
.stickygo .btn { width: 100%; min-height: 50px; font-size: 16px; }
/* 開票 */
.ballot { position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.ballot .vs { display: flex; justify-content: space-between; font-size: 13px; }
.ballot .vs b { font-size: 20px; display: block; }
.ballot .split { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0 6px; background: var(--line); }
.ballot .split i { display: block; height: 100%; }
.ballot .yes { background: var(--good); }
.ballot .no { background: var(--ink-2); }
.stamp { position: absolute; right: 14px; top: 50%; width: 92px; height: 92px; margin-top: -46px; border-radius: 50%; border: 4px solid var(--bad); color: var(--bad); display: grid; place-items: center; font-family: var(--font-display); font-size: 26px; transform: rotate(-12deg); opacity: .92; background: color-mix(in srgb, var(--surface) 70%, transparent); animation: stamp .5s cubic-bezier(.2,1.6,.4,1) both .35s; }
.stamp.pass { border-color: var(--me); color: var(--me); }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .92; } }
.factions { display: grid; gap: 8px; }
.fac { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.fac.dead { opacity: .5; }
.fac .dot { width: 14px; height: 14px; }
.fac .nm { font-weight: 700; }
.fac .facts { grid-column: 2; display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.fac .facts b { color: var(--ink); font-weight: 700; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.log li { font-size: 13px; padding: 6px 0 6px 12px; border-left: 3px solid var(--line); }
.log li.good { border-color: var(--good); }
.log li.bad { border-color: var(--bad); }
.log li.rival { color: var(--ink-2); }
.log li.season { border-color: var(--warn); }
.log h5 { margin: 12px 0 4px; font-size: 12px; color: var(--ink-2); letter-spacing: .06em; }
/* 相手の動きの再生 */
.replay { position: absolute; left: 12px; right: 12px; top: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--rp, var(--ink-2)); border-radius: 12px; padding: 8px 8px 8px 12px; box-shadow: 0 6px 18px rgb(0 0 0 / .14); cursor: pointer; }
.replay .rp-text { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.replay small { font-size: 11.5px; color: var(--ink-2); }
.replay b { font-size: 14px; }
.replay .rp-count { font-size: 11.5px; color: var(--ink-2); }
.replay button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 7px 10px; font-size: 12.5px; cursor: pointer; }
.replay.warn b { color: var(--bad); }
#map .pulse { stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; animation: pulse 1.3s ease-out both; }
@keyframes pulse { 0% { fill-opacity: 0; } 25% { fill-opacity: .6; } 55% { fill-opacity: .15; } 75% { fill-opacity: .5; } 100% { fill-opacity: .1; } }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; }
/* 人材 */
.roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.role { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--surface-2); }
.role small { display: block; color: var(--ink-2); font-size: 11.5px; }
.role b { display: block; font-size: 14px; }
.role .eff { font-size: 12px; color: var(--good); }
.role .eff.none { color: var(--ink-2); }
.people { display: grid; gap: 8px; }
.person { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.person .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.person .top b { font-size: 15px; }
.person .top small { color: var(--ink-2); font-size: 12px; }
.abil { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 12px; }
.abil span { display: flex; flex-direction: column; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 4px 0; color: var(--ink-2); }
.abil span b { color: var(--ink); font-size: 14px; }
.abil span.best { outline: 1.5px solid var(--me); }
.person select { width: 100%; }
.person .hirebtn { justify-self: start; }
.person .why { font-size: 12px; color: var(--ink-2); }
.h4 { font-size: 13px; margin: 18px 0 8px; color: var(--ink-2); letter-spacing: .04em; }
/* 予算規模 */
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface-2); padding: 6px 2px; font-size: 12.5px; cursor: pointer; line-height: 1.2; }
.seg button:last-child { border-right: 0; }
.seg button small { display: block; font-size: 10.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[aria-pressed="true"] small { color: var(--surface); opacity: .8; }
.seglabel { font-size: 11.5px; color: var(--ink-2); margin: 10px 0 0; display: flex; justify-content: space-between; gap: 8px; }
.grade { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1.5px solid var(--line); color: var(--ink-2); }
.grade.B { border-color: var(--r1); color: var(--r1); }
.grade.A { border-color: var(--r3); color: var(--r3); }
.grade.S { border-color: var(--me); color: #fff; background: var(--me); }
.scouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.scouts button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.scouts button small { font-size: 11.5px; color: var(--ink-2); }
.scouts button[aria-disabled="true"] { opacity: .55; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 560px) { .cmds { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>

<div id="app">
  <header class="status">
    <div class="date" id="date">令和8年4月</div>
    <div class="stat"><small>財源</small><b class="num" id="money">0億円</b></div>
    <div class="stat"><small>行動力</small><div class="pips" id="pips"></div></div>
    <div class="stat"><small>支配</small><b class="num" id="count">1/42</b></div>
    <button class="iconbtn" id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </header>
  <main class="mapwrap" id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="岐阜県42市町村の地図">
      <g id="munis"></g><g id="talks"></g><g id="pulse"></g><path class="sel" id="selPath" d=""></path><g class="lbl" id="labels"></g>
    </svg>
    <div class="chips" id="chips"></div>
    <div class="replay" id="replay" hidden role="status"><span class="rp-count num" id="rpCount"></span><div class="rp-text"><small id="rpWho"></small><b id="rpWhat"></b></div><button id="rpSkip">飛ばす</button></div>
    <div class="legend" id="legend"></div>
    <div class="toast" id="toast" hidden></div>
    <section class="sheet" id="sheet" aria-live="polite" data-open="true"></section>
  </main>
  <nav class="bottombar">
    <button id="facBtn">陣営</button>
    <button id="staffBtn">人材</button>
    <button id="newsBtn">ニュース<span class="badge" id="newsBadge" hidden>0</span></button>
    <button class="end" id="endBtn">月を終える<small id="endSub">5月へ</small></button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<script>
// 岐阜統一戦記 ゲームロジック（画面に依存しない部分）
(function (root) {
  'use strict';

  // code: [圏域, 人口(千人・概数), 特産タグ]
  const INFO = {

    '21382': ['西濃', 10, ''], '21383': ['西濃', 14, ''], '21401': ['西濃', 20, ''],

    '21205': ['中濃', 85, '刃物'], '21207': ['中濃', 19, '美濃和紙'], '21211': ['中濃', 57, ''],
    '21214': ['中濃', 100, ''], '21219': ['中濃', 39, '郡上おどり'], '21501': ['中濃', 8, ''],
    '21502': ['中濃', 6, ''], '21503': ['中濃', 10, ''], '21504': ['中濃', 4, ''],
    '21505': ['中濃', 10, ''], '21506': ['中濃', 7, ''], '21507': ['中濃', 2, ''],
    '21521': ['中濃', 18, ''],
    '21204': ['東濃', 107, '美濃焼'], '21206': ['東濃', 77, '栗きんとん'], '21208': ['東濃', 37, '美濃焼'],
    '21210': ['東濃', 48, '栗きんとん'], '21212': ['東濃', 55, '美濃焼'],
    '21203': ['飛騨', 84, '高山祭'], '21217': ['飛騨', 23, '飛騨牛'], '21220': ['飛騨', 30, '温泉'],
    '21604': ['飛騨', 1.5, '合掌造り']
  };
  const REGIONS = ['岐阜', '西濃', '中濃', '東濃', '飛騨'];

  // 季節で観光収入が伸びる月
  const SEASON = {
    '鵜飼': { months: [5, 6, 7, 8, 9, 10], x: 1.6 },
    '高山祭': { months: [4, 10], x: 2.2 },
    '郡上おどり': { months: [7, 8, 9], x: 1.8 },
    '栗きんとん': { months: [9, 10, 11], x: 1.6 },
    '温泉': { months: [12, 1, 2, 3], x: 1.5 },
    '合掌造り': { months: [1, 2, 8], x: 1.4 },
    '美濃焼': { months: [5], x: 1.8 },
    '刃物': { months: [10], x: 1.6 }
  };
  const TOUR_TAG = { '鵜飼': 30, '高山祭': 45, '郡上おどり': 30, '栗きんとん': 18, '温泉': 40,
    '合掌造り': 55, '美濃焼': 15, '刃物': 10, '美濃和紙': 20, '古戦場': 30, '飛騨牛': 20, '航空宇宙': 10 };
  const IND_TAG = { '刃物': 15, '美濃焼': 12, '航空宇宙': 22, '美濃和紙': 6 };

  const MONTHS_TXT = ms => ms.length >= 3 && ms.every((m, i) => i === 0 || m === (ms[i - 1] % 12) + 1) ? `${ms[0]}〜${ms[ms.length - 1]}月` : ms.map(m => m + '月').join('・');
  function tagInfo(tag) {
    if (!tag) return '';
    const parts = [];
    const sn = SEASON[tag];
    if (sn) parts.push(`${MONTHS_TXT(sn.months)}は観光収入が${sn.x}倍`);
    if (IND_TAG[tag]) parts.push(`産業力が高め（+${IND_TAG[tag]}）`);
    if (TOUR_TAG[tag] && !sn) parts.push(`観光力が高め（+${TOUR_TAG[tag]}）`);
    if (tag === '合掌造り') parts.unshift('観光力がとても高い');
    if (tag === '郡上おどり') parts.push('8月に満足度+5');
    if (tag === '美濃和紙') parts.push('この市を持つ陣営の人材は企画+8');
    return parts.join('。');
  }
  const RIVAL_CANDIDATES = ['21201', '21202', '21204', '21203', '21214', '21205', '21206'];
  const FACTION_COLORS = ['me', 'r1', 'r2', 'r3'];

  function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rnd(st) {
    st.seed = (st.seed + 0x6D2B79F5) | 0;
    let t = st.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function dateOf(turn) {
    const idx = 3 + turn; // 令和8年4月スタート
    const month = (idx % 12) + 1;
    const year = 2026 + Math.floor(idx / 12);
    return { month, year, reiwa: year - 2018, label: `令和${year - 2018}年${month}月` };
  }

  function difficultyOf(code) {
    const p = INFO[code][1];
    if (p >= 150) return 'やさしい';
    if (p >= 35) return 'ふつう';
    if (p >= 5) return 'むずかしい';
    return '超むずかしい';
  }

  function newGame(map, startCode, seed) {
    const names = {}; const adj = {};
    for (const m of map.muni) { names[m.code] = m.name; adj[m.code] = m.adj; }
    const st = { ver: 1, seed: seed | 0, turn: 0, player: 0, over: null, log: [], talksMax: 2 };
    // ライバルは、プレイヤーと隣り合わない主要都市から3つ
    const rivals = [];
    for (const c of RIVAL_CANDIDATES) {
      if (rivals.length >= 3) break;
      if (c === startCode || adj[startCode].includes(c)) continue;
      if (rivals.some(r => adj[r].includes(c))) continue;
      rivals.push(c);
    }
    const caps = [startCode, ...rivals];
    st.factions = caps.map((c, i) => ({
      id: i, capital: c, color: FACTION_COLORS[i], name: i === 0 ? 'あなた' : names[c].replace(/(市|町|村)$/, '') + '陣営',
      money: 20 + Math.round(INFO[c][1] * 0.05), alive: true, negMonths: 0, ai: i !== 0
    }));
    st.m = {};
    for (const m of map.muni) {
      const [region, pop, tag] = INFO[m.code];
      const h = hash(m.code);
      const isCity = /市$/.test(m.name);
      st.m[m.code] = {
        owner: -1, pop,
        ind: clamp(Math.round((isCity ? 44 : 32) + Math.log10(pop + 1) * 8 + (IND_TAG[tag] || 0) + (h % 9) - 4), 15, 90),
        tour: clamp(Math.round(18 + (TOUR_TAG[tag] || 0) + ((h >>> 4) % 11) - 5), 8, 95),
        sat: 50 + ((h >>> 8) % 13) - 4,
        dis: 42 + ((h >>> 12) % 17),
        pact: [], talk: null, cool: {}
      };
    }
    caps.forEach((c, i) => { st.m[c].owner = i; st.m[c].sat = Math.max(st.m[c].sat, 56); });
    st.rel = st.factions.map(f => {
      const r = {};
      const capRegion = INFO[f.capital][0];
      for (const c in st.m) r[c] = 22 + (INFO[c][0] === capRegion ? 14 : 0) + (hash(c + f.id) % 12);
      return r;
    });
    ensureStaff(st);
    st.ap = apMax(st, 0);
    st.aiAp = st.factions.map(f => apMax(st, f.id));
    addLog(st, `${dateOf(0).label}、${names[startCode]}の首長に就任。目標は県内42市町村の統一。`, 'info');
    return st;
  }

  function addLog(st, text, kind) { st.log.push({ t: st.turn, text, kind: kind || 'info' }); if (st.log.length > 300) st.log.shift(); }

  function owned(st, f) { return Object.keys(st.m).filter(c => st.m[c].owner === f); }
  function apMax(st, f) { return 3 + Math.floor((owned(st, f).length - 1) / 4); }
  function totalPop(st, f) { return owned(st, f).reduce((s, c) => s + st.m[c].pop, 0); }
  function avgSat(st, f) {
    const cs = owned(st, f); const p = totalPop(st, f) || 1;
    return cs.reduce((s, c) => s + st.m[c].sat * st.m[c].pop, 0) / p;
  }


  // ---------- 人材 ----------
  const SURNAMES = ['加藤', '伊藤', '林', '山田', '渡辺', '小川', '長尾', '堀', '河合', '安藤', '大野', '早川', '松井', '杉山', '野村', '古田', '水野', '坂井', '土屋', '森', '日比野', '各務', '纐纈', '可知', '棚橋', '国枝', '後藤', '酒井', '牧野', '服部'];
  const GIVEN = ['健一', '真理子', '浩二', '由美', '隆', '恵子', '翔太', '彩', '誠', '千尋', '大輔', '美穂', '拓也', '香織', '修', '葵', '直樹', '智子', '亮', '陽菜', '慎吾', '明美', '悠真', '紀子', '和也', '玲奈', '剛', '咲', '康弘', '里美'];
  const ROLES = {
    deputy: { label: '副市長', key: 'pol', what: '全体の税収が上がる' },
    planning: { label: '企画課長', key: 'plan', what: '内政コマンドの効果が上がる' },
    nego: { label: '交渉担当', key: 'neg', what: '交流事業と住民投票の賛成が上がる' },
    tourism: { label: '観光大使', key: 'pop', what: '観光収入が上がる' }
  };
  const ABIL = { pol: '政策', neg: '交渉', plan: '企画', pop: '人望' };
  function ensureStaff(st) {
    if (st.staff) {
      // 古い版で名前が欠けた人材を直す
      for (const p of st.staff) if (/undefined/.test(p.name)) p.name = p.name.replace('undefined', GIVEN[hash(p.name + p.id) % GIVEN.length]);
      return;
    }
    st.staff = [];
    let id = 0;
    for (const c in st.m) {
      const n = INFO[c][1] >= 50 ? 2 : 1;
      for (let k = 0; k < n; k++) {
        const h = hash(c + ':' + k);
        const ab = {};
        for (const a of Object.keys(ABIL)) ab[a] = 30 + (hash(c + a + k) % 41);
        const keys = Object.keys(ABIL), best = keys[(h >>> 3) % 4];
        ab[best] = 72 + (h % 21);
        st.staff.push({ id: id++, name: SURNAMES[h % SURNAMES.length] + ' ' + GIVEN[(h >>> 7) % GIVEN.length], home: c, f: -1, role: null, ...ab });
      }
    }
    for (const fac of st.factions) for (const p of st.staff) if (p.home === fac.capital) p.f = fac.id;
    for (const fac of st.factions) autoAssign(st, fac.id);
  }
  function gradeOf(p) { const b = Math.max(p.pol, p.neg, p.plan, p.pop); return b >= 97 ? 'S' : b >= 90 ? 'A' : b >= 80 ? 'B' : 'C'; }
  const GRADE_PAY = { C: 0.5, B: 1, A: 2, S: 3 };
  // 県外からの招へい：お金で高いグレードの人材を迎える
  const SCOUT = {
    B: { cost: 40, lo: 55, hi: 78, best: [80, 89] },
    A: { cost: 90, lo: 65, hi: 85, best: [90, 96] },
    S: { cost: 180, lo: 75, hi: 92, best: [97, 100] }
  };
  function canScout(st, f, grade, apLeft) {
    if (staffOf(st, f).length >= staffMax(st, f)) return { ok: false, reason: `人材は${staffMax(st, f)}人までです` };
    if (apLeft < 1) return { ok: false, reason: '今月の行動力が足りません（1必要）' };
    if (st.factions[f].money < SCOUT[grade].cost) return { ok: false, reason: `財源が足りません（${SCOUT[grade].cost}億円必要）` };
    return { ok: true, cost: SCOUT[grade].cost };
  }
  function scout(st, f, grade) {
    const g = SCOUT[grade]; st.factions[f].money -= g.cost;
    const ab = {}, keys = Object.keys(ABIL);
    for (const a of keys) ab[a] = g.lo + Math.floor(rnd(st) * (g.hi - g.lo + 1));
    const best = keys[Math.floor(rnd(st) * 4)];
    ab[best] = g.best[0] + Math.floor(rnd(st) * (g.best[1] - g.best[0] + 1));
    const id = st.staff.reduce((m, q) => Math.max(m, q.id), -1) + 1;
    const p = { id, name: SURNAMES[Math.floor(rnd(st) * SURNAMES.length)] + ' ' + GIVEN[Math.floor(rnd(st) * GIVEN.length)], home: st.factions[f].capital, ext: true, f, role: null, ...ab };
    st.staff.push(p);
    return p;
  }
  function staffOf(st, f) { return (st.staff || []).filter(p => p.f === f); }
  function staffMax(st, f) { return 3 + Math.floor(owned(st, f).length / 3); }
  function abil(st, f, p, key) {
    let v = p[key];
    if (key === 'plan' && st.m['21207'] && st.m['21207'].owner === f) v += 8; // 美濃和紙
    return Math.min(100, v);
  }
  function roleVal(st, f, role) {
    const p = (st.staff || []).find(q => q.f === f && q.role === role);
    return p ? abil(st, f, p, ROLES[role].key) : 0;
  }
  function hireCandidates(st, adj, f) {
    return (st.staff || []).filter(p => p.f === -1 && (st.m[p.home].owner === f || (st.m[p.home].owner === -1 && adjacentTo(st, adj, p.home, f))));
  }
  function hireCost(p) { return Math.round(4 + (p.pol + p.neg + p.plan + p.pop) / 40); }
  function canHire(st, adj, f, id, apLeft) {
    const p = st.staff.find(q => q.id === id);
    if (!p || p.f !== -1) return { ok: false, reason: 'この人材は登用できません' };
    if (!hireCandidates(st, adj, f).includes(p)) return { ok: false, reason: '自陣営か、隣り合う独立市町村の人材だけ登用できます' };
    if (staffOf(st, f).length >= staffMax(st, f)) return { ok: false, reason: `人材は${staffMax(st, f)}人までです（市町村が増えると増えます）` };
    if (apLeft < 1) return { ok: false, reason: '今月の行動力が足りません（1必要）' };
    if (st.factions[f].money < hireCost(p)) return { ok: false, reason: `財源が足りません（${hireCost(p)}億円必要）` };
    return { ok: true, cost: hireCost(p) };
  }
  function hire(st, names, f, id) {
    const p = st.staff.find(q => q.id === id);
    st.factions[f].money -= hireCost(p); p.f = f; p.role = null;
    return `${names[p.home]}出身の${p.name}を登用`;
  }
  function assignRole(st, f, id, role) {
    for (const q of st.staff) if (q.f === f && q.role === role && role) q.role = null;
    const p = st.staff.find(q => q.id === id && q.f === f);
    if (p) p.role = role || null;
  }
  function aiStaff(st, adj, names, f, apRef) {
    const out = [];
    const fac = st.factions[f];
    if (apRef.ap > 0 && fac.money > 50 && factionIncome(st, f, 4) - upkeep(st, f) > 8 && staffOf(st, f).length < staffMax(st, f) && rnd(st) < 0.3) {
      const cands = hireCandidates(st, adj, f).sort((a, b) => (b.pol + b.neg + b.plan + b.pop) - (a.pol + a.neg + a.plan + a.pop));
      if (cands.length && canHire(st, adj, f, cands[0].id, apRef.ap).ok) { apRef.ap--; out.push({ text: `${fac.name}が${hire(st, names, f, cands[0].id)}`, code: cands[0].home, cmd: 'hire', f }); }
    }
    // お金に余裕があれば県外から招へい
    if (apRef.ap > 0 && staffOf(st, f).length < staffMax(st, f) && rnd(st) < 0.15) {
      const g = fac.money > 700 ? 'S' : fac.money > 350 ? 'A' : fac.money > 160 ? 'B' : null;
      if (g && canScout(st, f, g, apRef.ap).ok) { apRef.ap--; const p = scout(st, f, g); out.push({ text: `${fac.name}が県外から${g}ランクの${p.name}を招へい`, code: fac.capital, cmd: 'hire', f }); }
    }
    autoAssign(st, f);
    return out;
  }
  // 役職は、得意な能力の高い組み合わせから順に割り当てる
  function autoAssign(st, f) {
    const mine = staffOf(st, f);
    for (const q of mine) q.role = null;
    const pairs = [];
    for (const q of mine) for (const r of Object.keys(ROLES)) pairs.push({ q, r, v: abil(st, f, q, ROLES[r].key) });
    pairs.sort((a, b) => b.v - a.v);
    const usedQ = new Set(), usedR = new Set();
    for (const { q, r } of pairs) { if (usedQ.has(q.id) || usedR.has(r)) continue; q.role = r; usedQ.add(q.id); usedR.add(r); }
  }
  function staffUpkeep(st, f) { return staffOf(st, f).filter(p => p.role).reduce((s, p) => s + GRADE_PAY[gradeOf(p)], 0); }
  // 合併で、その市町村ゆかりの人材が加わる
  function staffOnMerge(st, names, c, f, prev) {
    const joined = [];
    for (const p of st.staff || []) {
      if (p.home !== c || p.ext) continue;
      if (staffOf(st, f).length >= staffMax(st, f)) break;
      if (p.f === -1 || (p.f === prev && prev >= 0 && !p.role && rnd(st) < 0.5)) { p.f = f; p.role = null; joined.push(p.name); }
    }
    return joined;
  }

  function upkeep(st, f) { return Math.round(owned(st, f).reduce((s, c) => s + 0.8 + st.m[c].pop * 0.012, 0) + staffUpkeep(st, f)); }
  function seasonX(code, month) {
    const s = SEASON[INFO[code][2]];
    return s && s.months.includes(month) ? s.x : 1;
  }
  function incomeOf(st, code, month) {
    const x = st.m[code];
    const base = x.pop * 0.05 * (0.6 + x.ind / 100);
    const tour = x.tour * 0.05 * seasonX(code, month);
    return base + tour;
  }
  // 地方交付税：人口の少ない市町村ほど多く交付される
  function grantOf(st, f) { return owned(st, f).reduce((s, c) => s + Math.max(0.3, 2.4 - st.m[c].pop * 0.02), 0); }
  function factionIncome(st, f, month) {
    let base = 0, tour = 0, pact = 0;
    for (const c in st.m) {
      const x = st.m[c];
      if (x.owner === f) { base += x.pop * 0.05 * (0.6 + x.ind / 100); tour += x.tour * 0.05 * seasonX(c, month); }
      else if (x.owner === -1 && x.pact.includes(f)) pact += incomeOf(st, c, month) * 0.15;
    }
    base *= 1 + roleVal(st, f, 'deputy') / 500;
    base += grantOf(st, f);
    tour *= 1 + roleVal(st, f, 'tourism') / 250;
    return Math.round(base + tour + pact);
  }

  const CMDS = {
    ind: { label: '産業振興', ap: 1, own: true, note: '産業力 +6' },
    tour: { label: '観光PR', ap: 1, own: true, note: '観光力 +7' },
    care: { label: '子育て支援', ap: 1, own: true, note: '満足度 +8' },
    dis: { label: '防災対策', ap: 1, own: true, note: '防災力 +8' },
    invite: { label: '企業誘致', ap: 2, own: true, note: '成功すると産業力 +12・人口増' },
    visit: { label: '交流事業', ap: 1, own: false, note: '関係度 +15' },
    pact: { label: '連携協定', ap: 1, own: false, note: '関係度50以上で締結' },
    talk: { label: '合併協議', ap: 2, own: false, note: '3か月後に住民投票' },
    counter: { label: '対抗提案', ap: 2, own: false, note: 'ほかの陣営の協議に割り込み、条件を競う' },
    raise: { label: '条件を上乗せ', ap: 1, own: false, note: '競り合いで選ばれやすくなる' },
    keep: { label: '引き留め', ap: 1, own: false, note: '住民投票の賛成 −5・満足度 +3' }
  };

  // 予算規模：お金を多く使うほど効果が大きい（ただし割高）
  const SCALES = [
    { label: '小規模', cost: 0.5, eff: 0.6 },
    { label: '標準', cost: 1, eff: 1 },
    { label: '大規模', cost: 2.5, eff: 1.8 },
    { label: '特大', cost: 5, eff: 2.8 }
  ];
  const SCALABLE = ['ind', 'tour', 'care', 'dis', 'visit'];
  function scaleOf(cmd, scale) { return SCALABLE.includes(cmd) ? SCALES[scale === undefined ? 1 : scale] : SCALES[1]; }
  function cmdEffect(st, f, cmd, scale) {
    const pb = Math.floor(roleVal(st, f, 'planning') / 25), nb = Math.floor(roleVal(st, f, 'nego') / 15);
    const base = { ind: 6 + pb, tour: 7 + pb, care: 8 + pb, dis: 8 + pb, visit: 15 + nb }[cmd];
    return base === undefined ? 0 : Math.round(base * scaleOf(cmd, scale).eff);
  }
  function cmdCost(st, cmd, code, scale) { return Math.round(cmdCostBase(st, cmd, code) * scaleOf(cmd, scale).cost); }
  function cmdCostBase(st, cmd, code) {
    const p = st.m[code].pop;
    switch (cmd) {
      case 'ind': case 'care': return Math.round(3 + p * 0.05);
      case 'tour': return Math.round(2 + p * 0.035);
      case 'dis': return Math.round(2 + p * 0.04);
      case 'invite': return Math.round(20 + p * 0.08);
      case 'visit': return 4;
      case 'pact': return 0;
      case 'talk': case 'counter': return Math.round(6 + p * 0.1);
      case 'raise': return Math.round(4 + p * 0.06);
      case 'keep': return Math.round(3 + p * 0.04);
    }
    return 0;
  }

  function adjacentTo(st, adj, code, f) { return adj[code].some(n => st.m[n].owner === f); }
  function inTalk(t, f) { return !!t && (t.f === f || t.rival === f); }
  function talksOf(st, f) { return Object.keys(st.m).filter(c => inTalk(st.m[c].talk, f)).length; }
  const BID_MAX = 5;
  const KEEP_MAX = 3, KEEP_STEP = 5, KEEP_AI = 0.5;

  function canDo(st, adj, f, cmd, code, apLeft, scale) {
    const r = canDoBase(st, adj, f, cmd, code, scale);
    if (!r.ok) return r;
    if (apLeft < CMDS[cmd].ap) return { ok: false, reason: `今月の行動力が足りません（${CMDS[cmd].ap}必要）` };
    if (st.factions[f].money < r.cost) return { ok: false, reason: `財源が足りません（${r.cost}億円必要）` };
    return r;
  }
  function canDoBase(st, adj, f, cmd, code, scale) {
    const x = st.m[code]; const def = CMDS[cmd];
    if (st.over) return { ok: false, reason: 'ゲームは終了しています' };
    const cost = cmdCost(st, cmd, code, scale);
    if (cmd === 'keep') {
      if (x.owner !== f) return { ok: false, reason: '自陣営の市町村だけで使えます' };
      if (!x.talk || inTalk(x.talk, f)) return { ok: false, reason: 'ほかの陣営から合併協議をかけられていません' };
      if ((x.talk.keep || 0) >= KEEP_MAX) return { ok: false, reason: `引き留めは${KEEP_MAX}段までです` };
      return { ok: true, cost };
    }
    if (def.own) {
      if (x.owner !== f) return { ok: false, reason: '自陣営の市町村だけで実行できます' };
      const key = { ind: 'ind', tour: 'tour', care: 'sat', dis: 'dis', invite: 'ind' }[cmd];
      if (x[key] >= 100) return { ok: false, reason: 'これ以上は上がりません' };
      return { ok: true, cost };
    }
    if (x.owner === f) return { ok: false, reason: '自陣営です' };
    if (!adjacentTo(st, adj, code, f)) return { ok: false, reason: '自陣営と隣り合っていません' };
    const rel = st.rel[f][code];
    const t = x.talk;
    if (cmd === 'visit') {
      if (rel >= 100) return { ok: false, reason: '関係度は最大です' };
      return { ok: true, cost };
    }
    if (cmd === 'pact') {
      if (x.owner !== -1) return { ok: false, reason: 'ほかの陣営の市町村とは協定を結べません' };
      if (x.pact.includes(f)) return { ok: false, reason: 'すでに協定を結んでいます' };
      if (rel < 50) return { ok: false, reason: `関係度が50に届いていません（現在${Math.round(rel)}）` };
      return { ok: true, cost };
    }
    if (cmd === 'raise') {
      if (!t || t.rival === undefined) return { ok: false, reason: '条件の競り合いが起きていません' };
      if (!inTalk(t, f)) return { ok: false, reason: 'この競り合いには参加していません' };
      if (t.bids[f] >= BID_MAX) return { ok: false, reason: `上乗せは${BID_MAX}段までです` };
      return { ok: true, cost };
    }
    if (cmd === 'talk' || cmd === 'counter') {
      if (cmd === 'talk' && t) return { ok: false, reason: inTalk(t, f) ? '合併協議の最中です' : 'ほかの陣営と協議中です。対抗提案で割り込めます' };
      if (cmd === 'counter') {
        if (!t) return { ok: false, reason: 'ほかの陣営の協議が進んでいません' };
        if (inTalk(t, f)) return { ok: false, reason: '自陣営の協議です' };
        if (t.rival !== undefined) return { ok: false, reason: 'すでに2陣営が競り合っています' };
      }
      if (x.cool[f] > 0) return { ok: false, reason: `否決のため、あと${x.cool[f]}か月は申し入れできません` };
      if (talksOf(st, f) >= st.talksMax) return { ok: false, reason: `同時に進められる協議は${st.talksMax}件までです` };
      if (x.owner === -1) {
        if (!x.pact.includes(f)) return { ok: false, reason: '先に連携協定を結ぶ必要があります' };
        if (rel < 70) return { ok: false, reason: `関係度が70に届いていません（現在${Math.round(rel)}）` };
      } else {
        if (st.factions[x.owner].capital === code && owned(st, x.owner).length > 3) return { ok: false, reason: '本拠地は、相手陣営の市町村が3つ以下になるまで切り崩せません' };
        const gap = avgSat(st, f) - x.sat;
        if (x.sat >= 45 && gap < 8) return { ok: false, reason: `切り崩すには、相手の満足度を45未満にするか、自陣営の平均満足度を相手より8以上高くします（現在 ${Math.round(x.sat)}、差 ${Math.round(gap)}）` };
        if (rel < 60) return { ok: false, reason: `関係度が60に届いていません（現在${Math.round(rel)}）` };
      }
      return { ok: true, cost };
    }
    return { ok: false, reason: '' };
  }

  function doCmd(st, names, f, cmd, code, scale) {
    const x = st.m[code]; const fac = st.factions[f];
    const cost = cmdCost(st, cmd, code, scale);
    fac.money -= cost;
    const e = cmdEffect(st, f, cmd, scale), sl = SCALABLE.includes(cmd) && scale !== undefined && scale !== 1 ? `・${SCALES[scale].label}` : '';
    const n = names[code]; const who = f === 0 ? '' : fac.name + 'が';
    const pb = Math.floor(roleVal(st, f, 'planning') / 25), nb = Math.floor(roleVal(st, f, 'nego') / 15);
    switch (cmd) {
      case 'ind': x.ind = clamp(x.ind + e, 0, 100); return `${who}${n}で産業振興（産業力 ${x.ind}${sl}）`;
      case 'tour': x.tour = clamp(x.tour + e, 0, 100); return `${who}${n}の観光PR（観光力 ${x.tour}${sl}）`;
      case 'care': x.sat = clamp(x.sat + e, 0, 100); return `${who}${n}で子育て支援（満足度 ${Math.round(x.sat)}${sl}）`;
      case 'dis': x.dis = clamp(x.dis + e, 0, 100); return `${who}${n}の防災対策（防災力 ${x.dis}${sl}）`;
      case 'invite':
        if (rnd(st) < 0.55 + x.ind / 400) { x.ind = clamp(x.ind + 12, 0, 100); x.pop += 1 + x.pop * 0.01; return `${who}${n}への企業誘致に成功（産業力 ${x.ind}）`; }
        return `${who}${n}への企業誘致は不調に終わりました`;
      case 'visit': st.rel[f][code] = clamp(st.rel[f][code] + e, 0, 100); return `${who}${n}と交流事業（関係度 ${Math.round(st.rel[f][code])}${sl}）`;
      case 'pact': x.pact.push(f); st.rel[f][code] = clamp(st.rel[f][code] + 5, 0, 100); return `${who}${n}と連携協定を締結`;
      case 'talk': x.talk = { f, left: 3 }; return `${who}${n}に合併協議を申し入れ`;
      case 'counter': {
        const t = x.talk; t.rival = f; t.bids = { [t.f]: 0, [f]: 0 }; t.left = Math.max(t.left, 2);
        const other = t.f === 0 ? 'あなたの陣営' : st.factions[t.f].name;
        return `${who}${n}に対抗提案（${other}と条件の競り合い）`;
      }
      case 'keep': {
        const t = x.talk; t.keep = (t.keep || 0) + 1; x.sat = clamp(x.sat + 3, 0, 100);
        return `${who}${n}で住民への引き留め（${t.keep}段目）`;
      }
      case 'raise': {
        const t = x.talk; t.bids[f]++;
        return `${who}${n}への条件を上乗せ（${t.bids[f]}段目）`;
      }
    }
    return '';
  }

  // AI 1陣営ぶんの行動
  function aiAct(st, adj, names, f) {
    let ap = apMax(st, f);
    const fac = st.factions[f];
    const out = [];
    const aiScale = () => fac.money > 600 ? 3 : fac.money > 220 ? 2 : 1;
    const tryDo = (cmd, code) => {
      let sc = SCALABLE.includes(cmd) ? aiScale() : undefined;
      let r = canDo(st, adj, f, cmd, code, ap, sc);
      while (!r.ok && sc > 1) { sc--; r = canDo(st, adj, f, cmd, code, ap, sc); }
      if (!r.ok) return false;
      ap -= CMDS[cmd].ap;
      const t0 = st.m[code].talk;
      const vsMe = ['counter', 'raise', 'keep'].includes(cmd) && !!t0 && (t0.f === 0 || t0.rival === 0);
      out.push({ text: doCmd(st, names, f, cmd, code, sc), code, cmd, f, vsMe });
      return true;
    };
    const apRef = { ap };
    for (const t of aiStaff(st, adj, names, f, apRef)) out.push(t);
    ap = apRef.ap;
    let guard = 12;
    while (ap > 0 && guard-- > 0) {
      if (rnd(st) < 0.25) { ap--; continue; } // ときどき様子見
      const near = Object.keys(st.m).filter(c => st.m[c].owner !== f && adjacentTo(st, adj, c, f));
      near.sort((a, b) => st.rel[f][b] - st.rel[f][a]);
      const border = near.filter(c => !st.m[c].talk);
      let done = false;
      if (fac.money > 0) {
        // 自分の市町村が狙われていれば引き留め
        for (const c of owned(st, f)) {
          const t = st.m[c].talk;
          if (t && !inTalk(t, f) && (t.keep || 0) < KEEP_MAX && fac.money > cmdCost(st, 'keep', c) * 2 && rnd(st) < KEEP_AI && tryDo('keep', c)) { done = true; break; }
        }
        if (done) continue;
        // 競り合いで負けていれば上乗せ
        for (const c of near) {
          const t = st.m[c].talk;
          if (t && t.rival !== undefined && inTalk(t, f)) {
            const other = t.f === f ? t.rival : t.f;
            if (t.bids[f] <= t.bids[other] && fac.money > cmdCost(st, 'raise', c) * 2 && rnd(st) < 0.75 && tryDo('raise', c)) { done = true; break; }
          }
        }
        if (!done) for (const c of near) { const t = st.m[c].talk; if (t && t.rival === undefined && t.f !== f && rnd(st) < 0.5 && tryDo('counter', c)) { done = true; break; } }
        if (!done) for (const c of border) { if (tryDo('talk', c)) { done = true; break; } }
        if (!done) for (const c of near) { if (st.m[c].owner === -1 && tryDo('pact', c)) { done = true; break; } }
        if (!done && fac.money > 12) {
          const t = near.find(c => st.m[c].owner === -1 && st.rel[f][c] < 95) || near.find(c => st.m[c].owner !== -1 && st.rel[f][c] < 80);
          if (t && tryDo('visit', t)) done = true;
        }
      }
      if (!done) {
        const mine = owned(st, f).sort((a, b) => st.m[a].sat - st.m[b].sat);
        const big = owned(st, f).sort((a, b) => st.m[b].pop - st.m[a].pop);
        if (mine.length && st.m[mine[0]].sat < 48 && tryDo('care', mine[0])) done = true;
        else if (fac.money > 60 && big.length && st.m[big[0]].sat < 66 && tryDo('care', big[0])) done = true;
        else if (fac.money > 80 && tryDo('invite', fac.capital)) done = true;
        else if (fac.money > 30 && tryDo('ind', fac.capital)) done = true;
      }
      if (!done) break;
    }
    return out;
  }

  function offerScore(st, f, code, bid) {
    return st.rel[f][code] + (avgSat(st, f) - st.m[code].sat) * 0.5 + bid * 8 + rnd(st) * 6;
  }
  function voteFor(st, f, code, bonus) {
    const x = st.m[code]; const rel = st.rel[f][code];
    let yes = 50 + (avgSat(st, f) - x.sat) * 0.4 + (rel - 70) * 0.6 + (rnd(st) * 20 - 10) + (bonus || 0) + roleVal(st, f, 'nego') / 12;
    if (x.pop > totalPop(st, f) * 0.7) yes -= 15;
    if (x.owner !== -1) yes -= 8;
    yes = clamp(yes, 4, 96);
    const turnout = 0.42 + rnd(st) * 0.25;
    const voters = Math.round(x.pop * 1000 * 0.82);
    const cast = Math.round(voters * turnout);
    const y = Math.round(cast * yes / 100);
    return { yes: y, no: cast - y, turnout, pass: y > cast - y };
  }

  // 月を終える
  function endTurn(st, adj, names) {
    const res = { votes: [], news: [], steps: [] };
    if (st.over) return res;
    ensureStaff(st);
    // ライバルの行動
    for (const fac of st.factions) {
      if (!fac.ai || !fac.alive) continue;
      for (const t of aiAct(st, adj, names, fac.id)) {
        addLog(st, t.text, 'rival');
        res.steps.push({ kind: 'rival', ...t, mine: st.m[t.code].owner === 0 });
      }
    }
    // 協議の進行と住民投票
    for (const c in st.m) {
      const x = st.m[c];
      if (!x.talk) continue;
      const t = x.talk;
      for (const k of [t.f, t.rival]) if (k !== undefined) st.rel[k][c] = clamp(st.rel[k][c] + 2, 0, 100);
      t.left--;
      if (t.left > 0) continue;
      let f = t.f, contest = null;
      if (t.rival !== undefined) {
        const a = t.f, b = t.rival;
        const sa = offerScore(st, a, c, t.bids[a]), sb = offerScore(st, b, c, t.bids[b]);
        const win = sa >= sb ? a : b, lose = win === a ? b : a;
        contest = { winner: win, loser: lose, bids: { [a]: t.bids[a], [b]: t.bids[b] } };
        f = win;
        st.rel[lose][c] = clamp(st.rel[lose][c] - 10, 0, 100); x.cool[lose] = 2;
        const nm = k => k === 0 ? 'あなたの陣営' : st.factions[k].name;
        addLog(st, `${names[c]}をめぐる条件の競り合いは${nm(win)}に決定（上乗せ ${t.bids[win]}段 対 ${t.bids[lose]}段）`, win === 0 ? 'good' : (lose === 0 ? 'bad' : 'rival'));
        res.steps.push({ kind: 'contest', code: c, ...contest, f: win });
      }
      const keep = x.owner >= 0 && x.owner !== f ? (t.keep || 0) : 0;
      const v = voteFor(st, f, c, (contest ? contest.bids[f] * 3 : 0) - keep * KEEP_STEP);
      if (contest) v.contest = contest;
      if (keep) v.keep = keep;
      const prev = x.owner;
      x.talk = null;
      const fac = st.factions[f];
      if (v.pass) {
        x.owner = f; x.pact = []; x.sat = clamp(x.sat - 8, 0, 100);
        for (const k of owned(st, f)) if (k !== c) st.m[k].sat = clamp(st.m[k].sat - 1, 0, 100);
        st.rel[f][c] = 60;
        const joined = staffOnMerge(st, names, c, f, prev);
        if (joined.length) { v.joined = joined; addLog(st, `${names[c]}ゆかりの${joined.join('・')}が${f === 0 ? 'あなたの陣営' : fac.name}に加わりました`, f === 0 ? 'good' : 'rival'); }
        addLog(st, `住民投票で${names[c]}が${f === 0 ? 'あなたの陣営' : fac.name}への編入を可決`, f === 0 ? 'good' : (prev === 0 ? 'bad' : 'rival'));
        if (prev > 0 && st.factions[prev].capital === c && owned(st, prev).length > 0) {
          const nc = owned(st, prev).sort((a, b) => st.m[b].pop - st.m[a].pop)[0];
          st.factions[prev].capital = nc;
          addLog(st, `${st.factions[prev].name}は本拠地を${names[nc]}に移しました`, 'rival');
        }
        if (prev >= 0 && owned(st, prev).length === 0) {
          st.factions[prev].alive = false;
          addLog(st, `${st.factions[prev].name}はすべての市町村を失いました`, 'info');
        }
      } else {
        x.cool[f] = 2; st.rel[f][c] = clamp(st.rel[f][c] - 20, 0, 100);
        addLog(st, `${names[c]}の住民投票は否決（${f === 0 ? 'あなたの陣営' : fac.name}との合併）`, f === 0 ? 'bad' : 'rival');
      }
      if (f === 0 || prev === 0 || (contest && contest.loser === 0)) res.votes.push({ code: c, f, prev, ...v });
      res.steps.push({ kind: 'vote', code: c, f, prev, ...v });
    }
    // 月を進める
    st.turn++;
    const d = dateOf(st.turn);
    // 季節・ランダムのイベント
    events(st, names, d.month, res);
    // 収入と住民の変化
    for (const fac of st.factions) {
      if (!fac.alive) continue;
      const inc = factionIncome(st, fac.id, d.month) - upkeep(st, fac.id);
      fac.money += inc;
      if (fac.id === 0) res.income = inc;
      fac.negMonths = fac.money < 0 ? fac.negMonths + 1 : 0;
    }
    for (const c in st.m) {
      const x = st.m[c];
      const target = x.owner === -1 ? 54 : 50;
      x.sat += (target - x.sat) * 0.04;
      if (x.owner >= 0 && st.factions[x.owner].money < 0) x.sat -= 3;
      x.sat = clamp(x.sat, 0, 100);
      x.pop = Math.max(0.3, x.pop * (1 + (x.sat - 55) * 0.00004));
      for (const k in x.cool) if (x.cool[k] > 0) x.cool[k]--;
      for (let f = 0; f < st.factions.length; f++) {
        if (x.owner === f) continue;
        if (x.pact.includes(f)) st.rel[f][c] = clamp(st.rel[f][c] + 3, 0, 100);
        else if (st.rel[f][c] > 35) st.rel[f][c] -= 0.5;
      }
    }
    // 勝敗
    const me = st.factions[0];
    const mine = owned(st, 0);
    if (st.m[me.capital].owner !== 0) st.over = { win: false, text: `本拠地の${names[me.capital]}がほかの陣営に編入されました。` };
    else if (me.negMonths >= 3) st.over = { win: false, text: '財源のマイナスが3か月続き、財政破綻となりました。' };
    else if (avgSat(st, 0) < 20) st.over = { win: false, text: '住民満足度が20を下回り、リコールが成立しました。' };
    else if (mine.length === Object.keys(st.m).length) st.over = { win: true, text: `${d.label}、岐阜県42市町村の統一を達成しました。` };
    // 圏域制覇の知らせ
    st.regionsDone = st.regionsDone || [];
    for (const r of REGIONS) {
      if (st.regionsDone.includes(r)) continue;
      const cs = Object.keys(st.m).filter(c => INFO[c][0] === r);
      if (cs.every(c => st.m[c].owner === 0)) { st.regionsDone.push(r); addLog(st, `${r}圏域をすべて自陣営にしました`, 'good'); res.news.push(`${r}圏域を制覇`); }
    }
    st.ap = apMax(st, 0);
    return res;
  }

  function events(st, names, month, res) {
    const codes = Object.keys(st.m);
    const ownerName = c => st.m[c].owner === 0 ? '（自陣営）' : '';
    // 季節の行事（観光収入は収入計算で反映）
    const fest = { 4: '高山祭（春）でにぎわっています', 10: '高山祭（秋）でにぎわっています' };
    if (fest[month]) addLog(st, `高山市は${fest[month]}`, 'season');
    if (month === 5) addLog(st, '長良川鵜飼が開幕。岐阜市・関市の観光収入が伸びます', 'season');
    if (month === 8) { st.m['21219'].sat = clamp(st.m['21219'].sat + 5, 0, 100); addLog(st, '郡上おどりが最高潮。郡上市の満足度が上がりました', 'season'); }
    // 豪雨（6〜9月）
    if ([6, 7, 8, 9].includes(month) && rnd(st) < 0.3) {
      const south = codes.filter(c => INFO[c][0] !== '飛騨');
      const c = south[Math.floor(rnd(st) * south.length)];
      disaster(st, names, c, '豪雨', ownerName, res);
    }
    // 豪雪（12〜2月）
    if ([12, 1, 2].includes(month) && rnd(st) < 0.4) {
      const north = codes.filter(c => INFO[c][0] === '飛騨' || c === '21219');
      const c = north[Math.floor(rnd(st) * north.length)];
      disaster(st, names, c, '豪雪', ownerName, res);
    }
    // 企業進出
    if (rnd(st) < 0.12) {
      const cand = codes.filter(c => st.m[c].ind >= 55);
      if (cand.length) {
        const c = cand[Math.floor(rnd(st) * cand.length)];
        st.m[c].ind = clamp(st.m[c].ind + 6, 0, 100); st.m[c].pop += 0.5;
        addLog(st, `${names[c]}${ownerName(c)}に企業が進出。産業力が上がりました`, st.m[c].owner === 0 ? 'good' : 'info');
        res.steps.push({ kind: 'event', code: c, text: `${names[c]}に企業が進出`, tone: 'good' });
      }
    }
  }

  function disaster(st, names, c, kind, ownerName, res) {
    const x = st.m[c];
    const hit = rnd(st) * 100 > x.dis;
    if (hit) {
      x.sat = clamp(x.sat - 9, 0, 100);
      if (x.owner >= 0) st.factions[x.owner].money -= Math.round(3 + x.pop * 0.03);
      addLog(st, `${kind}で${names[c]}${ownerName(c)}に被害。満足度と財源が下がりました`, x.owner === 0 ? 'bad' : 'info');
      res.steps.push({ kind: 'event', code: c, text: `${kind}で${names[c]}に被害`, tone: 'bad' });
      if (x.owner === 0) res.news.push(`${names[c]}で${kind}の被害`);
    } else {
      x.sat = clamp(x.sat + 2, 0, 100);
      addLog(st, `${kind}が${names[c]}${ownerName(c)}を襲いましたが、備えで被害を防ぎました`, x.owner === 0 ? 'good' : 'info');
      res.steps.push({ kind: 'event', code: c, text: `${kind}が${names[c]}を襲うも被害なし`, tone: 'good' });
    }

    <p style="font-size:15px">${o.text}</p><p class="sub">最終的な支配：${n}/42市町村、人口${L.totalPop(S, 0).toFixed(1)}千人</p>
    <div class="row"><button class="btn main" id="againBtn">新しく始める</button><button class="btn" id="viewBtn">地図を見る</button></div>`);
  $('againBtn').onclick = () => { clearSave(); showTitle(); };
  $('viewBtn').onclick = closeOverlay;
}

function roleEffect(r, v) {
  if (!v) return '';
  switch (r) {
    case 'deputy': return `税収 +${Math.round(v / 5)}％`;
    case 'planning': return `内政の効果 +${Math.floor(v / 25)}`;
    case 'nego': return `交流 +${Math.floor(v / 15)}・賛成 +${Math.round(v / 12)}`;
    case 'tourism': return `観光収入 +${Math.round(v / 2.5)}％`;
  }
  return '';
}
function abilHtml(p) {
  const keys = Object.keys(L.ABIL), best = keys.reduce((a, b) => p[b] > p[a] ? b : a);
  return `<div class="abil">${keys.map(k => `<span class="${k === best ? 'best' : ''}">${L.ABIL[k]}<b class="num">${L.abil(S, 0, p, k)}</b></span>`).join('')}</div>`;
}
// 新しく迎えた人を、空いている役職のうち一番得意なものに就ける
function fillEmpty(p) {
  const taken = new Set(L.staffOf(S, 0).filter(q => q.role).map(q => q.role));
  const free = Object.keys(L.ROLES).filter(r => !taken.has(r));
  if (!free.length) return '';
  const r = free.sort((a, b) => L.abil(S, 0, p, L.ROLES[b].key) - L.abil(S, 0, p, L.ROLES[a].key))[0];
  L.assignRole(S, 0, p.id, r);
  return `（${L.ROLES[r].label}に就任）`;
}
function gradeTag(p) { const g = L.gradeOf(p); return `<span class="grade ${g}" title="ランク${g}">${g}</span>`; }
function showStaff() {
  L.ensureStaff(S);
  const mine = L.staffOf(S, 0), max = L.staffMax(S, 0);
  const roles = Object.entries(L.ROLES).map(([r, def]) => {
    const p = mine.find(q => q.role === r), v = L.roleVal(S, 0, r);
    return `<div class="role"><small>${def.label}・${L.ABIL[def.key]}が効く</small><b>${p ? gradeTag(p) + ' ' + p.name : '空席'}</b><span class="eff${p ? '' : ' none'}">${p ? roleEffect(r, v) : def.what}</span></div>`;
  }).join('');
  const opts = p => `<option value="">役職なし</option>` + Object.entries(L.ROLES).map(([r, def]) => `<option value="${r}" ${p.role === r ? 'selected' : ''}>${def.label}（${L.ABIL[def.key]} ${L.abil(S, 0, p, def.key)}）</option>`).join('');
  const people = mine.map(p => `<div class="person"><div class="top">${gradeTag(p)}<b>${p.name}</b><small>${p.ext ? '県外から招へい' : NAMES[p.home] + '出身'}・役職の給与 月${L.GRADE_PAY[L.gradeOf(p)]}億円</small></div>${abilHtml(p)}
    <select data-role="${p.id}" aria-label="${p.name}の役職">${opts(p)}</select></div>`).join('') || '<p class="empty">まだ人材がいません。</p>';
  const cands = L.hireCandidates(S, ADJ, 0).sort((a, b) => (b.pol + b.neg + b.plan + b.pop) - (a.pol + a.neg + a.plan + a.pop));
  const hires = cands.slice(0, 8).map(p => {
    const r = L.canHire(S, ADJ, 0, p.id, S.ap);
    return `<div class="person"><div class="top">${gradeTag(p)}<b>${p.name}</b><small>${NAMES[p.home]}出身・${S.m[p.home].owner === 0 ? '自陣営' : '隣の独立市町村'}</small></div>${abilHtml(p)}
      <button class="btn hirebtn${r.ok ? ' main' : ''}" data-hire="${p.id}" aria-disabled="${!r.ok}">登用する（${L.hireCost(p)}億円・行動1）</button>${r.ok ? '' : `<span class="why">${r.reason}</span>`}</div>`;
  }).join('') || '<p class="empty">いま登用できる人材はいません。市町村を広げると見つかります。</p>';
  openOverlay(`<button class="iconbtn close" id="xBtn" aria-label="閉じる">✕</button><h3>人材</h3>
    <p class="sub">${mine.length}/${max}人。役職に就けると効果が出ます。役職の給与はランクで変わります（月 C1・B2・A3・S5億円）。${S.m['21207'].owner === 0 ? '美濃和紙の美濃市があるので、企画が+8されています。' : ''}</p>
    <div class="roles">${roles}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="autoBtn">得意な役職におまかせで配置</button></div>
    <div class="h4">あなたの陣営の人材</div><div class="people">${people}</div>
    <div class="h4">登用できる人材</div><div class="people">${hires}</div>
    <div class="h4">県外から招へい（行動1）</div>
    <p class="sub" style="margin-top:-2px">高いランクの人材を財源で迎えます。得意な能力がどれになるかは選べません。</p>
    <div class="scouts">${['B', 'A', 'S'].map(g => { const r = L.canScout(S, 0, g, S.ap); const d = L.SCOUT[g];
      return `<button data-scout="${g}" aria-disabled="${!r.ok}"><span class="grade ${g}">${g}</span><b class="num">${d.cost}億円</b><small>得意 ${d.best[0]}〜${d.best[1]}</small><small>${r.ok ? `給与 月${L.GRADE_PAY[g]}億円` : r.reason}</small></button>`; }).join('')}</div>`);
  $('xBtn').onclick = closeOverlay;
  $('autoBtn').onclick = () => { L.autoAssign(S, 0); save(); render(); showStaff(); toast('得意な役職に配置しました'); };
  for (const sl of document.querySelectorAll('[data-role]')) sl.onchange = () => { L.assignRole(S, 0, Number(sl.dataset.role), sl.value); save(); render(); showStaff(); };
  for (const b of document.querySelectorAll('[data-scout]')) b.onclick = () => {
    const g = b.dataset.scout, r = L.canScout(S, 0, g, S.ap);
    if (!r.ok) { toast(r.reason); return; }
    const p = L.scout(S, 0, g); S.ap -= 1;
    const text = `県外から${g}ランクの${p.name}を招へい${fillEmpty(p)}`;
    S.log.push({ t: S.turn, text, kind: 'good' }); seenLog = S.log.length;
    toast(text); save(); render(); showStaff();
  };
  for (const b of document.querySelectorAll('[data-hire]')) b.onclick = () => {
    const id = Number(b.dataset.hire), r = L.canHire(S, ADJ, 0, id, S.ap);
    if (!r.ok) { toast(r.reason); return; }
    const text = L.hire(S, NAMES, 0, id) + fillEmpty(S.staff.find(q => q.id === id)); S.ap -= 1;
    S.log.push({ t: S.turn, text, kind: 'good' }); seenLog = S.log.length;
    toast(text); save(); render(); showStaff();
  };
}
function showFactions() {
  const month = L.dateOf(S.turn).month;
  const rows = S.factions.map(f => `<div class="fac${f.alive ? '' : ' dead'}"><i class="dot" style="background:${colorVar(f.id)}"></i>
    <div class="nm">${f.name}${f.alive ? '' : '（消滅）'}</div>
    <div class="facts"><span>本拠 <b>${NAMES[f.capital]}</b></span><span>市町村 <b class="num">${L.owned(S, f.id).length}</b></span>
    <span>人口 <b class="num">${L.totalPop(S, f.id).toFixed(0)}千人</b></span><span>財源 <b class="num">${f.money}億円</b></span>
    <span>平均満足度 <b class="num">${Math.round(L.avgSat(S, f.id)) || 0}</b></span><span>月収入 <b class="num">${L.factionIncome(S, f.id, month)}億円</b></span></div></div>`).join('');
  const talks = Object.keys(S.m).filter(c => S.m[c].talk && S.m[c].talk.f === 0).map(c => `${NAMES[c]}（あと${S.m[c].talk.left}か月）`);
  const regions = L.REGIONS.map(r => { const cs = Object.keys(S.m).filter(c => L.INFO[c][0] === r); return `${r} ${cs.filter(c => S.m[c].owner === 0).length}/${cs.length}`; }).join('　');
  openOverlay(`<button class="iconbtn close" id="xBtn" aria-label="閉じる">✕</button><h3>陣営</h3>
    <p class="sub">圏域ごとの支配：${regions}</p><div class="factions">${rows}</div>
    <p class="sub" style="margin-top:14px">進行中の合併協議：${talks.length ? talks.join('、') : 'なし'}（同時に${S.talksMax}件まで）</p>`);
  $('xBtn').onclick = closeOverlay;
}
function showNews() {
  seenLog = S.log.length; renderStatus();
  let html = '', lastT = null;
  for (const e of [...S.log].reverse().slice(0, 120)) {
    if (e.t !== lastT) { if (lastT !== null) html += '</ul>'; html += `<h5>${L.dateOf(e.t).label}</h5><ul class="log">`; lastT = e.t; }
    html += `<li class="${e.kind}">${e.text}</li>`;
  }
  openOverlay(`<button class="iconbtn close" id="xBtn" aria-label="閉じる">✕</button><h3>ニュース</h3><p class="sub">新しい順。ライバルの動きは灰色で表示</p>${html}</ul>`);
  $('xBtn').onclick = closeOverlay;
}
function showMenu() {
  openOverlay(`<button class="iconbtn close" id="xBtn" aria-label="閉じる">✕</button><h3>メニュー</h3>
    <p class="sub">進み具合はこのブラウザに自動で保存されます。</p>
    <label class="toggle"><input type="checkbox" id="rpToggle" ${prefs.replay ? 'checked' : ''}>月を終えたあと、相手の動きを地図で見せる</label>
    <ul class="howto">${HOWTO}</ul>
    <div class="row"><button class="btn danger" id="resetBtn">最初からやり直す</button></div><div id="confirmBox"></div>`);
  $('xBtn').onclick = closeOverlay;
  $('rpToggle').onchange = e => { prefs.replay = e.target.checked; savePrefs(); };
  $('resetBtn').onclick = () => {
    $('confirmBox').innerHTML = `<p style="margin:12px 0 0">今の進み具合は消えます。やり直しますか？</p><div class="row"><button class="btn danger" id="yesReset">やり直す</button><button class="btn" id="noReset">やめる</button></div>`;
    $('yesReset').onclick = () => { clearSave(); showTitle(); };
    $('noReset').onclick = () => { $('confirmBox').innerHTML = ''; };
  };
}
const HOWTO = `<li><b>交流事業</b>で隣の市町村との関係度を上げる</li>
  <li>関係度50で<b>連携協定</b>（収入の一部が入る）、70で<b>合併協議</b></li>
  <li>協議の3か月後に<b>住民投票</b>。満足度が高いほど賛成が増える</li>
  <li>ライバルの市町村は、相手の満足度が低いか、こちらの平均満足度が8以上高いと切り崩せる</li>
  <li>ほかの陣営が協議中の市町村には<b>対抗提案</b>で割り込める。<b>条件を上乗せ</b>した段数が多いほど選ばれやすい</li>
  <li><b>人材</b>を登用して役職（副市長・企画課長・交渉担当・観光大使）に就けると、税収や内政、住民投票に効く。合併するとその市町村ゆかりの人材が加わる</li>
  <li>内政と交流事業は<b>予算規模</b>を選べる。大きいほど効果が大きいが割高</li>
  <li>人材にはC〜Sのランクがあり、<b>県外から招へい</b>で高ランクを迎えられる</li>
  <li>相手の本拠地は、その陣営の市町村が3つ以下になると切り崩せる</li>
  <li>自分の市町村が合併協議をかけられたら、<b>引き留め</b>で住民投票の賛成を下げられる（最大3段）</li>
  <li>財源のマイナスが3か月続くか、満足度が20を下回ると負け</li>`;

// ---------- タイトル ----------
const PICKS = [['やさしい', ['21201', '21202']], ['ふつう', ['21205', '21204', '21203']], ['むずかしい', ['21361', '21505']], ['超むずかしい', ['21604', '21507']]];
// 開始時の財源と、最初の月（4月）の収支を試算する
const PREVIEW = {};
function startPreview(c) {
  if (!PREVIEW[c]) {
    const st = L.newGame(MAP, c, 1);
    PREVIEW[c] = { st, money: st.factions[0].money, net: L.factionIncome(st, 0, 4) - L.upkeep(st, 0) };
  }
  return PREVIEW[c];
}
const signed = n => (n >= 0 ? '+' : '−') + Math.abs(n);
// 開始前に、その市町村の特産・人材・数値・ライバルを確かめる画面
let lastPick = null;
function showStartDetail(c) {
  lastPick = c;
  const pv = startPreview(c), st = pv.st, x = st.m[c], info = L.INFO[c];
  const tag = info[2];
  const meterP = (lb, v) => `<div class="meter"><span>${lb}</span><div class="bar"><i style="width:${Math.round(v)}%"></i></div><b class="num">${Math.round(v)}</b></div>`;
  const staff = st.staff.filter(p => p.f === 0).map(p => {
    const keys = Object.keys(L.ABIL), best = keys.reduce((a, b) => p[b] > p[a] ? b : a), g = L.gradeOf(p);
    const role = p.role ? L.ROLES[p.role] : null;
    const val = p.role ? L.abil(st, 0, p, role.key) : 0;
    return `<div class="person"><div class="top"><span class="grade ${g}">${g}</span><b>${p.name}</b><small>${role ? role.label + 'に就任' : '役職なし'}</small></div>
      <div class="abil">${keys.map(k => `<span class="${k === best ? 'best' : ''}">${L.ABIL[k]}<b class="num">${L.abil(st, 0, p, k)}</b></span>`).join('')}</div>
      ${role ? `<span class="why" style="color:var(--good)">${role.label}の効果：${roleEffect(p.role, val)}（給与 月${L.GRADE_PAY[g]}億円）</span>` : ''}</div>`;
  }).join('') || '<p class="empty">ゆかりの人材はいません。</p>';
  const rivals = st.factions.slice(1).map(f => `<span class="tag owner" style="background:var(--${f.color})">${f.name}</span>`).join(' ');
  const nb = ADJ[c].map(n => NAMES[n]).join('、');
  openOverlay(`<button class="btn" id="backBtn">← 市町村選びに戻る</button>
    <div class="kicker" style="margin-top:16px">${info[0]}圏域・${L.difficultyOf(c)}</div>
    <div class="logo" style="font-size:clamp(32px,10vw,48px)">${NAMES[c]}</div>
    <div class="grid2">
      <div class="kv"><span>人口</span><b class="num">${info[1]}千人</b></div>
      <div class="kv"><span>開始時の財源</span><b class="num">${pv.money}億円</b></div>
      <div class="kv"><span>4月の収入</span><b class="num">${L.factionIncome(st, 0, 4)}億円</b></div>
      <div class="kv"><span>維持費と給与</span><b class="num">${L.upkeep(st, 0)}億円</b></div>
      <div class="kv"><span>月収支</span><b class="num" style="color:${pv.net >= 0 ? 'var(--good)' : 'var(--bad)'}">${signed(pv.net)}億円</b></div>
      <div class="kv"><span>うち地方交付税</span><b class="num">${L.grantOf(st, 0).toFixed(1)}億円</b></div>
    </div>
    <div class="h4">特産</div>
    ${tag ? `<p style="margin:0"><span class="tag">${tag}</span></p><p class="note" style="color:var(--ink)">${L.tagInfo(tag)}</p>` : '<p class="note">特産タグはありません。産業と観光を伸ばして個性をつくります。</p>'}
    <div class="h4">数値</div>
    <div class="meters">${meterP('産業力', x.ind)}${meterP('観光力', x.tour)}${meterP('満足度', x.sat)}${meterP('防災力', x.dis)}</div>
    <div class="h4">最初からいる人材</div><div class="people">${staff}</div>
    <div class="h4">隣の市町村（${ADJ[c].length}）</div><p class="note" style="margin:0">${nb}</p>
    <div class="h4">ライバル</div><p style="margin:0;display:flex;gap:6px;flex-wrap:wrap">${rivals}</p>
    <div class="stickygo"><button class="btn main" id="goBtn">${NAMES[c]}で始める</button></div>`, 'title-panel');
  $('backBtn').onclick = showTitle;
  $('goBtn').onclick = () => startNew(c);
}
function showTitle() {
  const saved = loadSaved();
  const groups = PICKS.map(([lv, cs]) => `<div><h4>${lv}</h4><div class="opts">${cs.map(c => `<button data-start="${c}">${NAMES[c]}<small>${L.INFO[c][0]}・人口${L.INFO[c][1]}千人${L.INFO[c][2] ? '・' + L.INFO[c][2] : ''}</small><span class="money num">財源 ${startPreview(c).money}億円・月収支 ${signed(startPreview(c).net)}億円</span></button>`).join('')}</div></div>`).join('');
  const opts = L.REGIONS.map(r => `<optgroup label="${r}圏域">${Object.keys(NAMES).filter(c => L.INFO[c][0] === r).map(c => `<option value="${c}">${NAMES[c]}（${L.difficultyOf(c)}・財源${startPreview(c).money}億・月${signed(startPreview(c).net)}億）</option>`).join('')}</optgroup>`).join('');
  openOverlay(`<div class="kicker">令和8年4月　岐阜県・21市19町2村</div>
    <div class="logo">岐阜<em>統一</em>戦記</div>
    <p class="lead">あなたは岐阜県のある市町村の首長。交流と協定で信頼を集め、住民投票で合併を重ね、42市町村をひとつにまとめてください。</p>
    ${saved && !saved.over ? `<div class="row" style="margin:0 0 18px"><button class="btn main" id="contBtn">つづきから（${L.dateOf(saved.turn).label}・${saved.factions[0] ? NAMES[saved.factions[0].capital] : ''}）</button></div>` : ''}
    <div class="pick"><div><h4>首長になる市町村を選ぶ</h4><p class="sub" style="margin:0">タップすると特産や最初の人材などの詳細が見られます。月収支は最初の月（4月）の収入から維持費と給与を引いた額で、季節や内政で変わります。</p></div>${groups}
    <div><h4>ほかの市町村から選ぶ</h4><div class="selrow"><select id="startSel" aria-label="開始する市町村">${opts}</select><button class="btn" id="selStart">詳細を見る</button></div><p class="sub num" id="selPreview" style="margin:8px 0 0"></p></div></div>
    <ul class="howto">${HOWTO}</ul>
    <p class="sub" style="margin-top:14px">人口は統計を丸めた概数、そのほかの数値はゲーム用です。登場する陣営や出来事は架空です。地図：国土数値情報（行政区域データ）を加工</p>`, 'title-panel');
  if (lastPick) { const el = document.querySelector(`[data-start="${lastPick}"]`); if (el) el.scrollIntoView({ block: 'center' }); else if ($('startSel')) { $('startSel').value = lastPick; } }
  for (const b of document.querySelectorAll('[data-start]')) b.onclick = () => showStartDetail(b.dataset.start);
  $('selStart').onclick = () => showStartDetail($('startSel').value);
  const showPrev = () => { const c = $('startSel').value, pv = startPreview(c); $('selPreview').textContent = `${NAMES[c]}：人口${L.INFO[c][1]}千人・開始時の財源 ${pv.money}億円・月収支 ${signed(pv.net)}億円（4月時点）`; };
  $('startSel').onchange = showPrev; showPrev();
  if ($('contBtn')) $('contBtn').onclick = () => { S = saved; afterLoad(); };
}
function startNew(code) {
  S = L.newGame(MAP, code, (Date.now() & 0x7fffffff));
  afterLoad(); save();
  toast(`${NAMES[code]}の首長に就任しました`);
}
function afterLoad() {
  L.ensureStaff(S);
  sel = null; seenLog = S.log.length; closeOverlay(); render();
  const b = bboxOf(Object.keys(NAMES));
  vb = fitBox(b, 14); setVB(); lastBox = { x: b.x - 14, y: b.y - 14, w: b.w + 28, h: b.h + 28 };
  for (const x of $('chips').children) x.setAttribute('aria-pressed', x.dataset.r === '全県' ? 'true' : 'false');
}

$('endBtn').onclick = endMonth;
$('facBtn').onclick = () => S && showFactions();
$('staffBtn').onclick = () => S && !replay && showStaff();
$('newsBtn').onclick = () => S && showNews();
$('menuBtn').onclick = () => S && showMenu();
$('overlay').addEventListener('click', e => { if (e.target === $('overlay') && S && !$('panel').classList.contains('title-panel') && !queue.length && !$('okBtn') && !$('againBtn')) closeOverlay(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden && $('xBtn')) closeOverlay(); });

let started = false;
function start(data) {
  if (started) { if (data && data.state) { S = data.state; afterLoad(); } return; }
  started = true;
  buildMap();
  vb = fitBox({ x: 0, y: 0, w: MAP.w, h: MAP.h }, 14); setVB();
  if (data && data.state) { S = data.state; afterLoad(); } else showTitle();
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
