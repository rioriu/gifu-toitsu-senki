<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>岐阜統一戦記</title>
<meta name="description" content="岐阜県42市町村を、連携協定と合併で統一する内政シミュレーション。">
<meta property="og:type" content="website">
<meta property="og:title" content="岐阜統一戦記">
<meta property="og:description" content="岐阜県42市町村を、連携協定と合併で統一する内政シミュレーション。">
<meta property="og:url" content="https://rioriu.github.io/gifu-toitsu-senki/">
<meta property="og:image" content="https://rioriu.github.io/gifu-toitsu-senki/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="status">
    <div class="date" id="date">令和8年4月</div>
    <div class="stat"><small>財源 <em class="num" id="net"></em></small><b class="num" id="money">0億円</b></div>
    <div class="stat"><small>行動力</small><div class="pips" id="pips"></div></div>
    <div class="stat"><small id="countLbl">支配</small><b class="num" id="count">1/42</b></div>
    <button class="iconbtn" id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </header>
  <main class="mapwrap" id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="岐阜県42市町村の地図">
      <g id="munis"></g><g id="realm"></g><g id="talks"></g><g id="pulse"></g><g id="flash"></g><path class="sel" id="selPath" d=""></path><g class="lbl" id="labels"></g>
    </svg>
    <div class="chips" id="chips"></div>
    <div class="replay" id="replay" hidden role="status"><span class="rp-count num" id="rpCount"></span><div class="rp-text"><small id="rpWho"></small><b id="rpWhat"></b></div><button id="rpSkip">飛ばす</button></div>
    <div class="legend" id="legend"></div>
    <div class="sfxhint" id="sfxHint" hidden><button class="on" id="sfxOn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>効果音をオンにする</button><button class="x" id="sfxX" type="button" aria-label="効果音の案内を閉じる">×</button></div>
    <div class="toast" id="toast" hidden></div>
    <section class="sheet" id="sheet" aria-live="polite" data-open="true"></section>
  </main>
  <nav class="bottombar">
    <button id="facBtn">陣営</button>
    <button id="staffBtn">人材</button>
    <button id="newsBtn">ニュース<span class="badge" id="newsBadge" hidden>0</span></button>
    <button class="end" id="endBtn">月を終える<small id="endSub">5月へ</small></button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<script src="js/logic.js"></script>
<script src="js/map-data.js"></script>
<script src="js/sound.js"></script>
<script src="js/battle.js"></script>
<script src="js/icons.js"></script>
<script src="js/version.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
